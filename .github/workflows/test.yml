name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  version-check:
    name: Require version update
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version update or exemption
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq "lib/slidict/version.rb"; then
            echo "lib/slidict/version.rb is included in this pull request."
            exit 0
          fi

          if printf '%s\n' "$PR_BODY" | grep -Eiq '^- \[[x]\] This pull request does not require a version update\. <!-- skip-version-check -->[[:space:]]*$'; then
            echo "The version update exemption is checked in the pull request description."
            exit 0
          fi

          echo "::error::Update lib/slidict/version.rb or check the version update exemption in the pull request description."
          exit 1

  ruby:
    name: Ruby tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ["3.2", "3.3", "3.4", "4.0"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rake spec

      - name: Smoke test CLI
        run: |
          printf 'PDF Difference Monitoring Service\n5 minutes\nEngineering managers\nApprove an MVP pilot\n' | bin/slidict --output /tmp/slidict-smoke.md
          test -s /tmp/slidict-smoke.md
          grep -q '# PDF Difference Monitoring Service' /tmp/slidict-smoke.md
